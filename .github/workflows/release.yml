name: release

on:
  release:
    types: [published]
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    inputs:
      draft:
        default: false
        description: "Create a draft release"
        required: true
        type: boolean
      prerelease:
        default: false
        description: "Create a prerelease"
        required: true
        type: boolean

permissions:
  contents: write
  discussions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IS_PRERELEASE: ${{ github.event.inputs.prerelease || false }}
      IS_DRAFT: ${{ github.event.inputs.draft || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          repository: ${{ github.repository }}
      - name: Publish to crates.io
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: cargo-publish
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
          token: ${{ github.token }}
      - name: update release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          draft: ${{ env.IS_DRAFT }}
          prerelease: ${{ env.IS_PRERELEASE }}
          tag_name: ${{ github.event.release.tag_name }}
          body: |
            ${{ github.event.release.body }}

            ## Links

            - [crates.io](https://crates.io/crates/${{ github.event.repository.name }})
            - [docs.rs](https://docs.rs/${{ github.event.repository.name }})
