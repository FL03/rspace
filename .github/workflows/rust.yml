name: rust

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
    paths:
      - "**.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/rust.yml"
  push:
    branches: [main, master]
    tags: [latest, v*.*.*, "*-nightly"]
  release:
    types: [created, edited]
  repository_dispatch:
    types: [rust]
  workflow_dispatch:
    inputs:
      benchmark:
        default: false
        description: "Run benchmarks"
        required: true
        type: boolean
      nightly:
        default: false
        description: "Run nightly tests"
        required: true
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  RUN_BENCHMARKS: ${{ github.event_name == 'push' || inputs.benchmark }}
  RUN_NIGHTLY_TESTS: ${{ inputs.nightly }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          target: ${{ matrix.target }}
      - name: Build the workspace
        run: cargo build --release --locked --workspace --features full --target ${{ matrix.target }}
  benchmark:
    if: ${{ github.env.RUN_BENCHMARKS }}
    needs: build
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.cargo-bench.outputs.digest }}
      id: ${{ steps.cargo-bench.outputs.id }}
      url: ${{ steps.cargo-bench.outputs.url }}
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          repository: ${{ github.repository }}
      - name: Benchmark the workspace
        id: cargo-bench
        uses: peter-evans/repository-dispatch@v4
        with:
          event-type: cargo-bench
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
          token: ${{ github.token }}
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [full, default]
        target: [x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          target: ${{ matrix.target }}
      - name: Test (${{ matrix.features }})
        if: matrix.features != 'default' && matrix.features != 'all'
        run: cargo test -r --locked --workspace --target ${{ matrix.target }} --features ${{ matrix.features }}
      - name: Test (default)
        if: matrix.features == 'default'
        run: cargo test -r --locked --workspace --target ${{ matrix.target }}
  test_nightly:
    if: ${{ github.env.RUN_NIGHTLY_TESTS }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [nightly, no_std]
        target: [x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          target: ${{ matrix.target }}
          toolchain: nightly
      - name: Test (${{ matrix.features }})
        if: matrix.features != 'no_std' && matrix.features != 'all'
        run: cargo test -r --locked --workspace  --target ${{ matrix.target }} --features ${{ matrix.features }}
      - name: Test (no_std)
        if: matrix.features == 'no_std'
        env:
          RUSTFLAGS: "-Zno_std"
        run: cargo test -r --locked --workspace --no-default-features --target ${{ matrix.target }} 
